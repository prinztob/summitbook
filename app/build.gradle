plugins {
    id 'com.google.devtools.ksp'
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
    id 'com.chaquo.python'
    id 'androidx.room'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'de.drtobiasprinz.summitbook'

    defaultConfig {
        applicationId "de.drtobiasprinz.summitbook"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        python {
            version "3.13"
            pip {
                install "six"
                install "pydantic==1.10.22"
                install "garth==0.5.16"
                install "garminconnect==0.2.28"
                install "requests"
                install "gpxpy"
                install "geopy"
                install "lxml"
                install "pandas"
                install "PyYAML"
                install "tcxreader"
                install "dateutils"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }
    room {
        schemaDirectory "$projectDir/schemas"
    }
}
android {
    compileSdkVersion 36
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}
dependencies {
    //Android
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    //Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    //Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.activity:activity-ktx:1.12.2'
    //Dagger Hilt
    implementation "com.google.dagger:hilt-android:2.57.2"
    kapt "com.google.dagger:hilt-compiler:2.57.2"
    //Room
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    implementation("net.mamoe.yamlkt:yamlkt:0.13.0")
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'com.github.yalantis:ucrop:2.2.11'

    implementation 'com.github.bumptech.glide:glide:5.0.5'

    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'com.github.MKergall:osmbonuspack:6.9.0'

    implementation 'androidx.preference:preference-ktx:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation "org.robolectric:robolectric:4.16"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'

    implementation 'com.github.ticofab:android-gpx-parser:2.3.1'

    // MapsForge (for offline maps)
    implementation 'org.osmdroid:osmdroid-mapsforge:6.1.20'
    //noinspection NewerVersionAvailable -> does not work with osmdroid-mapsforge:6.1.20
    implementation 'org.mapsforge:mapsforge-map-android:0.21.0'
    //noinspection NewerVersionAvailable -> does not work with osmdroid-mapsforge:6.1.20
    implementation 'org.mapsforge:mapsforge-map:0.21.0'
    //noinspection NewerVersionAvailable -> does not work with osmdroid-mapsforge:6.1.20
    implementation 'org.mapsforge:mapsforge-themes:0.21.0'
    //noinspection NewerVersionAvailable -> does not work with osmdroid-mapsforge:6.1.20
    implementation 'org.mapsforge:mapsforge-map-reader:0.21.0'

    // Jetpack Compose
    implementation 'androidx.compose.runtime:runtime:1.10.0'
    implementation 'androidx.compose.foundation:foundation:1.10.0'
    implementation 'androidx.compose.ui:ui:1.10.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.10.0'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material:1.10.0'
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.compose.runtime:runtime-livedata:1.10.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'
    implementation 'com.google.accompanist:accompanist-pager:0.36.0'
    implementation 'com.google.accompanist:accompanist-pager-indicators:0.36.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.10.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.10.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.10.0'
    
    // Glance for App Widgets
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation 'androidx.glance:glance-material3:1.1.1'
    
    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.11.1'
    
    // Vico chart library
    implementation 'com.patrykandpatrick.vico:compose:2.1.3'
    implementation 'com.patrykandpatrick.vico:compose-m3:2.1.3'
}