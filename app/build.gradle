plugins {
    alias(libs.plugins.ksp)
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
    alias(libs.plugins.chaquopy)
    alias(libs.plugins.androidx.room)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace = 'de.drtobiasprinz.summitbook'
    compileSdk 37

    defaultConfig {
        applicationId "de.drtobiasprinz.summitbook"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        python {
            version = "3.10"
            pip {
                install "six"
                install "pydantic==1.10.22"
                install "garth==0.5.16"
                install "garminconnect==0.2.28"
                install "requests"
                install "gpxpy"
                install "pandas"
                install "PyYAML"
                install "tcxreader"
                install "dateutils"
                install "numpy"
                install "Pillow"
                install "scipy"
            }
        }
        chaquopy {
            defaultConfig {
                buildPython("/home/prinzt/.pyenv/shims/python")
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }
    room {
        schemaDirectory "$projectDir/schemas"
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}
